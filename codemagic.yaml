workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: cd
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thov.thovario
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "com.thov.thovario" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        script: flutter test
      - name: Build ipa for distribution
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/Library/Logs/Gym/*.log
      - flutter_drive.log
