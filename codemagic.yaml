workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: cd
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Automatically create/fetch code signing certificates & profiles in cloud
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.thov.thovario" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=cloud
          keychain add-certificates
      - name: Apply code signing settings to Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        script: flutter test
      - name: Build ipa for distribution
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/Library/Logs/Gym/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
